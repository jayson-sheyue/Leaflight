name: Community Story Pool Indexer

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-story-pool-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  index-story:
    if: contains(github.event.issue.title, '[Story Pool]') || contains(github.event.issue.body, '```leaflight-story') || contains(github.event.issue.body, 'leaflight-share-package:v1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POOL_RESULT: ${{ runner.temp }}/story-pool-result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate attachment or legacy payload and build catalog
        run: node scripts/story-pool-index.cjs
      - name: Commit and push archive
        run: node scripts/story-pool-commit.cjs
      - name: Report indexing result on the submission
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEX_JOB_STATUS: ${{ job.status }}
        run: node scripts/story-pool-feedback.cjs
