name: Share Story to Community Pool / 分享小说到公共书池
description: Upload a Leaflight ZIP share package. Long novels welcome.
title: "[Story Pool] "
body:
  - type: markdown
    attributes:
      value: |
        ### Leaflight · 分享作品
        在新版 Leaflight 中点击「分享包投稿」，保存生成的 ZIP。
        将 ZIP 拖入下方输入框，等待附件上传完成，再提交。无需粘贴小说全文。
        收录结果会回复在本投稿下；更新章节请编辑原投稿并替换附件。
        Export a ZIP share package in Leaflight, attach it below, wait for upload, then submit.
  - type: textarea
    id: story_payload
    attributes:
      label: Share package / ZIP 分享包
      description: Attach the ZIP here (25 MB max). Legacy leaflight-story JSON blocks are still accepted.
      placeholder: Drag the .zip file here / 将 ZIP 拖入此处
    validations:
      required: true
