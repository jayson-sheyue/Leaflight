name: Share Story to Community Pool / 分享小说到公共书池
description: Share a graded English or Japanese story generated in Leaflight so other readers can enjoy it without an API key.
title: "[Story Pool] "
labels: ["story-pool"]
body:
  - type: markdown
    attributes:
      value: |
        ### ✧ Leaflight Community Story Pool · 公共书池投稿
        在 Leaflight 客户端点击 **「分享 → 免 Token · 浏览器一键投稿」** 后，完整作品数据已自动复制到剪贴板。
        请直接在下方文本框中粘贴（`Cmd + V` / `Ctrl + V`）并点击 **Submit new issue** 即可！
  - type: textarea
    id: story_payload
    attributes:
      label: Story Payload / 作品数据（直接粘贴）
      description: Must contain a ```leaflight-story JSON block generated by Leaflight.
      placeholder: "Paste clipboard content from Leaflight here..."
    validations:
      required: true
